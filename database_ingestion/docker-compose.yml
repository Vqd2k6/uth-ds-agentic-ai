version: '3.8'

services:
  # 1. MongoDB Document Store
  mongodb:
    image: mongo:7.0
    container_name: uth_ds_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: uth_ds_agentic
    volumes:
      - mongo_data:/data/db

  # 2. Qdrant Vector Database (Dense + Sparse Hybrid Search)
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: uth_ds_qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

  # 3. Neo4j Knowledge Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: uth_ds_neo4j
    restart: always
    ports:
      - "7474:7474"   # Web HTTP Interface (Neo4j Browser)
      - "7687:7687"   # Bolt Binary Protocol
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mongo_data:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
